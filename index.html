<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>专属浪漫 - To 孔文丽 ❤️</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0510 0%, #050104 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 关键：防止手机微信拖动时触发页面下拉回弹 */
        }
        #tip {
            position: fixed;
            bottom: 24px;
            width: 100%;
            text-align: center;
            color: rgba(255, 182, 193, 0.6);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="tip">✨ 手指按住屏幕拖动可 360° 旋转视角 ✨</div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ================= 🌟 自定义专属表白配置区 🌟 =================
        const CONFIG = {
            centerTitle: "To 孔文丽 ❤️", // 爱心正中央的核心名字/标题
            floatingWords: [             // 环绕在3D星云中的名字与情话
                "永远偏爱你", "My Only One", "朝朝暮暮", 
                "2026.10.18", "星河滚烫，你是人间理想", 
                "喜欢你", "For You", "岁岁年年",
                "满眼都是你", "Forever Love", "陪你看完每一次日落"
            ],
            particleCount: 7000,         // 爱心粒子数量
            bgStarCount: 1500            // 背景星空粒子数量
        };
        // =============================================================

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 自动识别手机竖屏与电脑横屏，确保手机上环绕情话完整显示在屏幕内
        camera.position.z = window.innerWidth < window.innerHeight ? 85 : 55;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 总容器（用于整体拖拽旋转）
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const heartGroup = new THREE.Group();
        worldGroup.add(heartGroup);

        // 生成柔和发光粒子贴图（无需外部图片）
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 120, 160, 0.8)');
            grad.addColorStop(0.7, 'rgba(255, 30, 90, 0.25)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const particleTexture = createGlowTexture();

        // 1. 构建 3D 粒子爱心
        const positions = new Float32Array(CONFIG.particleCount * 3);
        const basePositions = new Float32Array(CONFIG.particleCount * 3);
        const colors = new Float32Array(CONFIG.particleCount * 3);
        const randomPhases = new Float32Array(CONFIG.particleCount);

        const colorInside = new THREE.Color('#ff1e56');
        const colorOutside = new THREE.Color('#ffaccc');

        for (let i = 0; i < CONFIG.particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const r = Math.pow(Math.random(), 0.38);

            let x = 16 * Math.pow(Math.sin(t), 3) * r;
            let y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
            let z = (Math.random() - 0.5) * 14 * Math.sqrt(Math.max(0, 1 - r * r * 0.85));

            if (Math.random() < 0.12) {
                const spread = 1.05 + Math.random() * 0.35;
                x *= spread;
                y *= spread;
                z *= spread;
            }

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            basePositions[i * 3] = x;
            basePositions[i * 3 + 1] = y;
            basePositions[i * 3 + 2] = z;

            randomPhases[i] = Math.random() * Math.PI * 2;

            const mixedColor = colorInside.clone().lerp(colorOutside, Math.random() * r);
            colors[i * 3] = mixedColor.r;
            colors[i * 3 + 1] = mixedColor.g;
            colors[i * 3 + 2] = mixedColor.b;
        }

        const heartGeo = new THREE.BufferGeometry();
        heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        heartGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const heartMat = new THREE.PointsMaterial({
            size: 0.9,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const heartPoints = new THREE.Points(heartGeo, heartMat);
        heartGroup.add(heartPoints);

        // 2. 创建 3D 文字精灵函数
        function createTextSprite(text, fontSize = 36, color = '#ffd1dc', scale = 12) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff2a6d';
            ctx.shadowBlur = 16;
            ctx.fillStyle = color;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(scale, scale * 0.25, 1);
            return sprite;
        }

        // 添加中心主名字
        const centerSprite = createTextSprite(CONFIG.centerTitle, 46, '#ffffff', 16);
        centerSprite.position.set(0, 1.5, 0);
        heartGroup.add(centerSprite);

        // 添加环绕 3D 情话标签
        const wordSprites = [];
        CONFIG.floatingWords.forEach((word, idx) => {
            const sprite = createTextSprite(word, 32, '#ffb3c6', 13);
            const angle = (idx / CONFIG.floatingWords.length) * Math.PI * 2;
            const radius = 22 + Math.random() * 14;
            sprite.userData = {
                angle: angle,
                radius: radius,
                yOffset: (Math.random() - 0.5) * 26,
                speed: 0.002 + Math.random() * 0.003
            };
            worldGroup.add(sprite);
            wordSprites.push(sprite);
        });

        // 3. 背景浪漫星尘
        const bgGeo = new THREE.BufferGeometry();
        const bgPos = new Float32Array(CONFIG.bgStarCount * 3);
        for (let i = 0; i < CONFIG.bgStarCount * 3; i++) {
            bgPos[i] = (Math.random() - 0.5) * 160;
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        const bgMat = new THREE.PointsMaterial({
            size: 0.7,
            map: particleTexture,
            color: 0xffb6c1,
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const bgStars = new THREE.Points(bgGeo, bgMat);
        worldGroup.add(bgStars);

        // 4. 交互控制：支持鼠标 & 触屏拖拽旋转 + 滚轮缩放
        let isDragging = false;
        let prevX = 0, prevY = 0;
        let targetRotX = 0, targetRotY = 0;

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            targetRotY += (e.clientX - prevX) * 0.007;
            targetRotX += (e.clientY - prevY) * 0.007;
            targetRotX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotX));
            prevX = e.clientX;
            prevY = e.clientY;
        });
        window.addEventListener('pointerup', () => isDragging = false);
        window.addEventListener('pointercancel', () => isDragging = false);
        window.addEventListener('wheel', (e) => {
            camera.position.z = Math.max(25, Math.min(110, camera.position.z + e.deltaY * 0.03));
        });

        // 5. 动画循环（真实心跳节律 + 粒子呼吸闪烁）
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            const beat = Math.pow(Math.sin(elapsed * 3.2), 63) * 0.22 + Math.sin(elapsed * 3.2 + 1.5) * 0.05;
            const scale = 1 + beat;

            const posAttr = heartGeo.attributes.position;
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const bx = basePositions[i * 3];
                const by = basePositions[i * 3 + 1];
                const bz = basePositions[i * 3 + 2];
                const wave = 1 + Math.sin(elapsed * 2.5 + randomPhases[i]) * 0.03;

                posAttr.array[i * 3] = bx * scale * wave;
                posAttr.array[i * 3 + 1] = by * scale * wave;
                posAttr.array[i * 3 + 2] = bz * scale * wave;
            }
            posAttr.needsUpdate = true;

            wordSprites.forEach(s => {
                s.userData.angle += s.userData.speed;
                s.position.x = Math.cos(s.userData.angle) * s.userData.radius;
                s.position.z = Math.sin(s.userData.angle) * s.userData.radius;
                s.position.y = s.userData.yOffset + Math.sin(elapsed * 1.5 + s.userData.angle) * 1.5;
            });

            if (!isDragging) targetRotY += 0.0025;
            worldGroup.rotation.y += (targetRotY - worldGroup.rotation.y) * 0.08;
            worldGroup.rotation.x += (targetRotX - worldGroup.rotation.x) * 0.08;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.position.z = window.innerWidth < window.innerHeight ? 85 : 55;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
